name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: k3_owner
          POSTGRES_PASSWORD: k3_owner
          POSTGRES_DB: k3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U k3_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://k3_owner:k3_owner@localhost:5432/k3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Migrations apply from zero on real Postgres
        run: npm run db:migrate
      - name: Tests (PGlite)
        run: npm test
      - run: npm run build
